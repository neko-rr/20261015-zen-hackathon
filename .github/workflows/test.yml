# push の前段、および pull request でデモ経路が壊れていないかを見る。
# Gemini やクラウドへの実呼び出しはしない。
name: test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libgl1
          python -m pip install -r apps/api/requirements.txt pytest httpx

      - name: Run pytest
        run: python -m pytest apps/api/tests -q
        env:
          SESSION_SIGNING_SECRET: test-session-signing-secret-not-for-production
          SESSION_COOKIE_SECURE: "false"
          VISION_WARM: "0"
          GCS_BUCKET: ""
          RAG_ENABLED: ""

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
