# main への push と手動実行。テストが通ってから Cloud Run に出す。
# GitHub 変数: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA
# GitHub secret（任意）: SESSION_SIGNING_SECRET。無いときは Cloud Run に既にある値を残す。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: illustration-support
  REGION: asia-northeast2
  RUNTIME_SA: run-runtime@illustration-support.iam.gserviceaccount.com

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        env:
          SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
        run: |
          VARS="GOOGLE_CLOUD_PROJECT=illustration-support,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_ENTERPRISE=True,GCS_BUCKET=illustration-support-photos,SESSION_COOKIE_SECURE=true"
          if [ -n "$SESSION_SIGNING_SECRET" ]; then
            VARS="${VARS},SESSION_SIGNING_SECRET=${SESSION_SIGNING_SECRET}"
          fi
          gcloud run deploy illustration-api \
            --source apps/api \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --max-instances 2 \
            --update-env-vars "$VARS"

      - name: Deploy web
        run: |
          API_URL=$(gcloud run services describe illustration-api --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          gcloud run deploy illustration-web \
            --source apps/web \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --max-instances 2 \
            --update-env-vars "API_BASE_URL=${API_URL},NEXT_PUBLIC_API_BASE_URL=/drawref-api"
          WEB_URL=$(gcloud run services describe illustration-web --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          gcloud run services update illustration-api \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --update-env-vars "CORS_ORIGINS=${WEB_URL}"
