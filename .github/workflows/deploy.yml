# リポジトリ変数を入れてから動く。ローカルは scripts/deploy.ps1 でも可。
# 必要な変数: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: illustration-support
  REGION: asia-northeast2
  RUNTIME_SA: run-runtime@illustration-support.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API
        run: |
          gcloud run deploy illustration-api \
            --source apps/api \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --max-instances 2 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=illustration-support,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_ENTERPRISE=True,GCS_BUCKET=illustration-support-photos"

      - name: Deploy web when Dockerfile exists
        if: hashFiles('apps/web/Dockerfile') != ''
        run: |
          API_URL=$(gcloud run services describe illustration-api --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          gcloud run deploy illustration-web \
            --source apps/web \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --max-instances 2 \
            --set-env-vars "NEXT_PUBLIC_API_BASE_URL=${API_URL}"
